<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            font-size: 14px;
        }
        .container-fluid {
            padding: 1rem;
            max-width: 100%;
        }
        .content-card {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        .content-card h2 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #dee2e6;
            background-color: #f8f9fa;
        }
        .list-group-item {
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
        }
        .badge {
            font-size: 0.75em;
        }
        .placeholder-text {
            padding: 1rem;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6">
                <div class="content-card">
                    <h2>Models</h2>
                    <div class="list-group list-group-flush">
                        {% if models %}
                            {% for model in models %}
                                <a href="/blogs/" class="list-group-item list-group-item-action">
                                    {{ model.name }}
                                </a>
                            {% endfor %}
                        {% else %}
                             <div class="placeholder-text">No models detected in `app.py`.</div>
                        {% endif %}
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="content-card">
                    <h2>Forms</h2>
                    <div class="list-group list-group-flush">
                         {% if user_forms %}
                            {% for form in user_forms %}
                                <a href="/user-forms/" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                    {{ form.name }}
                                    <span class="badge bg-secondary">{{ form.type }}</span>
                                </a>
                            {% endfor %}
                        {% else %}
                            <div class="placeholder-text">No forms detected in `app.py`.</div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
