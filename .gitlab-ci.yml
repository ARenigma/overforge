# GitLab CI/CD for Overforge
#
# Mirrors the green local pipeline (lint + tests + build). The repo is an npm
# workspace (root package-lock.json covers backend + frontend), so every Node
# job installs once at the root with `npm ci` and runs per-workspace scripts.
#
# Lean for the free tier's 400 CI minutes/month: the npm download cache is reused
# across jobs, the pipeline runs only on `main` and merge requests, and the heavy
# Playwright E2E is manual-only. Postgres is reachable at host `postgres`.

stages:
  - hygiene
  - lint
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

default:
  interruptible: true

# Shared Node setup: workspace install at root, npm cache reused across jobs.
.node:
  image: node:20
  variables:
    npm_config_cache: '$CI_PROJECT_DIR/.npm'
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

# ─────────────────────── 1. Hygiene: no secrets / .env ───────────────────────
hygiene:
  stage: hygiene
  image: alpine:3.20
  before_script:
    - apk add --no-cache git
  script:
    - |
      if git ls-files | grep -E '(^|/)(\.env$|\.env\.[a-z0-9]+$)' | grep -v '\.env\.example$'; then
        echo "❌ Real .env files are tracked."; exit 1
      fi
    - |
      if git ls-files | grep -E '(_key\.txt|_api_key\.txt|secrets/)' | grep -v node_modules; then
        echo "❌ Key files are tracked."; exit 1
      fi
    - echo "✅ hygiene clean"

# Secret scan over full history (GitLab shallow-clones by default; GIT_DEPTH:0 = full)
gitleaks:
  stage: hygiene
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: ['']
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --redact -v --no-banner

# ─────────────────────── 2. Lint ───────────────────────
lint-node:
  extends: .node
  stage: lint
  script:
    - npm run lint --workspace=backend
    - npm run lint --workspace=frontend
    - npm run typecheck --workspace=backend

# ─────────────────────── 3. Tests ───────────────────────
test-backend:
  extends: .node
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    npm_config_cache: '$CI_PROJECT_DIR/.npm'
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: overforge_test
    NODE_ENV: test
    PORT: '5001'
    SUPABASE_URL: 'https://test.supabase.co'
    SUPABASE_SERVICE_ROLE_KEY: 'test-service-role-key'
    SUPABASE_ANON_KEY: 'test-anon-key'
    DB_HOST: postgres
    DB_PORT: '5432'
    DB_USER: postgres
    DB_PASSWORD: postgres
    DB_NAME: overforge_test
    JWT_SECRET: 'ci-test-secret'
  script:
    - npm test --workspace=backend -- --ci --coverage --maxWorkers=2
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'

# ─────────────────────── 4. Build ───────────────────────
build-frontend:
  extends: .node
  stage: build
  variables:
    npm_config_cache: '$CI_PROJECT_DIR/.npm'
    NEXT_PUBLIC_API_URL: 'http://localhost:5001'
    NEXT_PUBLIC_SOCKET_URL: 'http://localhost:5001'
    NEXT_PUBLIC_SUPABASE_URL: 'https://test.supabase.co'
    NEXT_PUBLIC_SUPABASE_ANON_KEY: 'test-anon-key'
  script:
    - npm run build --workspace=frontend
  artifacts:
    paths: [frontend/.next]
    expire_in: 3 days
    when: on_success

# ─────────────────────── Optional: E2E (manual — protects the 400-min budget) ───
e2e-playwright:
  stage: build
  image: mcr.microsoft.com/playwright:v1.49.0-jammy
  when: manual
  allow_failure: true
  variables:
    NEXT_PUBLIC_API_URL: 'http://localhost:5001'
    NEXT_PUBLIC_SUPABASE_URL: 'https://test.supabase.co'
    NEXT_PUBLIC_SUPABASE_ANON_KEY: 'e2e-test-anon-key'
  before_script:
    - npm ci --no-audit --no-fund
  script:
    - npm run build --workspace=frontend
    - npm run test:e2e --workspace=frontend -- --project=chromium --reporter=line e2e/smoke.spec.ts e2e/api.spec.ts e2e/room.spec.ts
  artifacts:
    when: always
    paths: [frontend/playwright-report]
    expire_in: 7 days

# ─────────────────────── 5. Deploy frontend → Vercel (private repo, no git link) ───
# Runs on main once VERCEL_TOKEN (masked) is set in CI/CD variables. The Vercel project
# already holds the NEXT_PUBLIC_* vars, so the remote build embeds them. Vercel never
# accesses the repo — CI ships the frontend/ dir using the token + project/org IDs.
deploy-frontend:
  stage: deploy
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $VERCEL_TOKEN'
  variables:
    VERCEL_ORG_ID: 'team_3gHsyR3zCdpVWtnv3r0SJ5Vq'
    VERCEL_PROJECT_ID: 'prj_l87xKr7EHmwof8lhSHquhXlPEL5B'
  script:
    - cd frontend
    - npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
  environment:
    name: production
    url: https://overforge.vercel.app

# ─────────────────────── 6. Deploy backend → beef VPS (ARM, native build) ───
# Runs on main once BEEF_SSH_KEY (file CI var) is set. Ships backend/ + deploy/ to
# beef over SSH and rebuilds the backend image natively on arm64, then health-checks
# through Caddy. The host-only deploy/backend.env (secrets) is preserved.
deploy-backend:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $BEEF_SSH_KEY'
  before_script:
    - apk add --no-cache openssh-client rsync curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$BEEF_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - printf 'Host beef\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n' "$BEEF_HOST" "$BEEF_USER" > ~/.ssh/config
  script:
    - rsync -az --delete --exclude node_modules --exclude '.env*' backend/ beef:overforge/backend/
    - rsync -az --exclude backend.env deploy/ beef:overforge/deploy/
    - ssh beef 'cd ~/overforge && docker compose -f deploy/docker-compose.yml up -d --build backend && sleep 4 && docker compose -f deploy/docker-compose.yml ps'
    - ssh beef 'curl -fsS --resolve 140.245.14.50.sslip.io:443:127.0.0.1 https://140.245.14.50.sslip.io/health'
  environment:
    name: backend-beef
    url: https://140.245.14.50.sslip.io
