# GitLab CI/CD for Overforge
#
# Mirrors the green local pipeline (lint + tests + build). The repo is an npm
# workspace (root package-lock.json covers backend + frontend), so every Node
# job installs once at the root with `npm ci` and runs per-workspace scripts.
#
# Lean for the free tier's 400 CI minutes/month: the npm download cache is reused
# across jobs, the pipeline runs only on `main` and merge requests, and the heavy
# Playwright E2E is manual-only. Postgres is reachable at host `postgres`.

stages:
  - hygiene
  - lint
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

default:
  interruptible: true

# Shared Node setup: workspace install at root, npm cache reused across jobs.
.node:
  image: node:20
  variables:
    npm_config_cache: '$CI_PROJECT_DIR/.npm'
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

# ─────────────────────── 1. Hygiene: no secrets / .env ───────────────────────
hygiene:
  stage: hygiene
  image: alpine:3.20
  before_script:
    - apk add --no-cache git
  script:
    - |
      if git ls-files | grep -E '(^|/)(\.env$|\.env\.[a-z0-9]+$)' | grep -v '\.env\.example$'; then
        echo "❌ Real .env files are tracked."; exit 1
      fi
    - |
      if git ls-files | grep -E '(_key\.txt|_api_key\.txt|secrets/)' | grep -v node_modules; then
        echo "❌ Key files are tracked."; exit 1
      fi
    - echo "✅ hygiene clean"

# Secret scan over full history (GitLab shallow-clones by default; GIT_DEPTH:0 = full)
gitleaks:
  stage: hygiene
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: ['']
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --redact -v --no-banner

# ─────────────────────── 2. Lint ───────────────────────
lint-node:
  extends: .node
  stage: lint
  script:
    - npm run lint --workspace=backend
    - npm run lint --workspace=frontend
    - npm run typecheck --workspace=backend

# ─────────────────────── 3. Tests ───────────────────────
test-backend:
  extends: .node
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    npm_config_cache: '$CI_PROJECT_DIR/.npm'
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: overforge_test
    NODE_ENV: test
    PORT: '5001'
    SUPABASE_URL: 'https://test.supabase.co'
    SUPABASE_SERVICE_ROLE_KEY: 'test-service-role-key'
    SUPABASE_ANON_KEY: 'test-anon-key'
    DB_HOST: postgres
    DB_PORT: '5432'
    DB_USER: postgres
    DB_PASSWORD: postgres
    DB_NAME: overforge_test
    JWT_SECRET: 'ci-test-secret'
  script:
    - npm test --workspace=backend -- --ci --coverage --maxWorkers=2
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'

# ─────────────────────── 4. Build ───────────────────────
build-frontend:
  extends: .node
  stage: build
  variables:
    npm_config_cache: '$CI_PROJECT_DIR/.npm'
    NEXT_PUBLIC_API_URL: 'http://localhost:5001'
    NEXT_PUBLIC_SOCKET_URL: 'http://localhost:5001'
    NEXT_PUBLIC_SUPABASE_URL: 'https://test.supabase.co'
    NEXT_PUBLIC_SUPABASE_ANON_KEY: 'test-anon-key'
  script:
    - npm run build --workspace=frontend
  artifacts:
    paths: [frontend/.next]
    expire_in: 3 days
    when: on_success

# ─────────────────────── Optional: E2E (manual — protects the 400-min budget) ───
# Frontend Playwright suite. Playwright boots its OWN prod server via
# PLAYWRIGHT_START_WEB_SERVER=true (`npm run start` against the built .next), so the
# tests have a server to hit. api.spec.ts is intentionally excluded — it needs the
# live backend + AI module, which this frontend-only job does not start.
e2e-playwright:
  stage: build
  image: mcr.microsoft.com/playwright:v1.49.0-jammy
  when: manual
  allow_failure: true
  variables:
    PLAYWRIGHT_START_WEB_SERVER: 'true'
    NEXT_PUBLIC_API_URL: 'http://localhost:5001'
    NEXT_PUBLIC_SUPABASE_URL: 'https://test.supabase.co'
    NEXT_PUBLIC_SUPABASE_ANON_KEY: 'e2e-test-anon-key'
  before_script:
    - npm ci --no-audit --no-fund
  script:
    - npm run build --workspace=frontend
    - npm run test:e2e --workspace=frontend -- --project=chromium --reporter=line e2e/smoke.spec.ts e2e/auth.spec.ts e2e/room.spec.ts e2e/interview-flow.spec.ts
  artifacts:
    when: always
    paths: [frontend/playwright-report]
    expire_in: 7 days

# ─────────────────────── Optional: automated candidate-mimic (manual) ───────────
# A real headless Chromium drives the WHOLE interview against the LIVE deploy (prod by default),
# exactly as a candidate would: consent gate -> oral -> coding -> RUN -> terminal. Standalone
# package in playwright/ (not the workspace). Manual + gated on OF_TEST_PASSWORD so it never runs
# on a normal push (it creates real interviews + burns oracle/TTS budget). Add these CI variables:
#   OF_TEST_PASSWORD (masked) — dev@overforge.local password (a DEV_EMAILS account)
#   OF_SUPABASE_URL, OF_SUPABASE_ANON_KEY — public Supabase values
#   OF_API_URL (optional) — backend base; defaults to the VPS
# Point OF_FRONTEND_URL at a Vercel preview to test that instead (the backend must allow its origin).
e2e-mimic:
  stage: deploy
  image: mcr.microsoft.com/playwright:v1.48.0-jammy
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $OF_TEST_PASSWORD'
      when: manual
  allow_failure: true
  variables:
    HEADLESS: '1'
  before_script:
    - apt-get update && apt-get install -y ffmpeg
    - cd playwright && npm ci --no-audit --no-fund && npx playwright install chromium
  script:
    - bash fixtures/make-fixtures.sh || true
    - npm run test:mimic
  artifacts:
    when: always
    paths: [playwright/playwright-report, playwright/test-results]
    expire_in: 7 days

# ─────────────────────── Optional: candidate-mimic vs a Vercel PREVIEW (manual, MR-only) ───
# Same mimic, but against a fresh Vercel PREVIEW deploy of this MR's frontend (backend stays prod).
# So a frontend PR gets a full-interview smoke BEFORE merge. Manual + gated on the secrets so it
# never runs on a normal MR push (deploys a preview + creates real interviews + burns oracle/TTS).
# Preview deploys are SSO-walled → the mimic clears them with the Vercel automation-bypass secret
# (OF_VERCEL_BYPASS, via URL param). REQUIRES the prod backend to have CORS_PREVIEW_REGEX set
# (deploy/backend.env) or the preview room is CORS-blocked calling the prod backend.
# CI vars: VERCEL_TOKEN, OF_VERCEL_BYPASS, OF_TEST_PASSWORD (all masked), OF_SUPABASE_URL/ANON_KEY.
e2e-mimic-preview:
  stage: deploy
  image: mcr.microsoft.com/playwright:v1.48.0-jammy
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OF_TEST_PASSWORD && $VERCEL_TOKEN && $OF_VERCEL_BYPASS'
      when: manual
  allow_failure: true
  variables:
    HEADLESS: '1'
    VERCEL_ORG_ID: 'team_3gHsyR3zCdpVWtnv3r0SJ5Vq'
    VERCEL_PROJECT_ID: 'prj_l87xKr7EHmwof8lhSHquhXlPEL5B'
  before_script:
    - apt-get update && apt-get install -y ffmpeg
  script:
    # Deploy a preview (remote build — same pattern as deploy-frontend, minus --prod). The ORG/PROJECT
    # id env vars link the unlinked dir; the CLI prints the deploy URL as its last stdout line.
    - cd frontend
    - npx --yes vercel@latest deploy --yes --token="$VERCEL_TOKEN" > ../preview-url.txt 2> ../preview-build.log || (cat ../preview-build.log; exit 1)
    - PREVIEW_URL="$(grep -Eo 'https://overforge-[a-z0-9-]+-arenigmas-projects\.vercel\.app' ../preview-url.txt | tail -n1)"
    - echo "Preview = $PREVIEW_URL"
    - case "$PREVIEW_URL" in https://overforge-*-arenigmas-projects.vercel.app): ;; *) echo "Unexpected preview URL"; cat ../preview-url.txt; exit 1;; esac
    # Run the mimic against the preview frontend + prod backend. OF_API_URL unset → env.ts default (VPS).
    - cd ../playwright && npm ci --no-audit --no-fund && npx playwright install chromium
    - bash fixtures/make-fixtures.sh || true
    - OF_FRONTEND_URL="$PREVIEW_URL" npm run test:mimic
  artifacts:
    when: always
    paths: [playwright/playwright-report, playwright/test-results, preview-build.log]
    expire_in: 7 days

# ─────────────────────── 5. Deploy frontend → Vercel (private repo, no git link) ───
# Runs on main once VERCEL_TOKEN (masked) is set in CI/CD variables. The Vercel project
# already holds the NEXT_PUBLIC_* vars, so the remote build embeds them. Vercel never
# accesses the repo — CI ships the frontend/ dir using the token + project/org IDs.
deploy-frontend:
  stage: deploy
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $VERCEL_TOKEN'
  variables:
    VERCEL_ORG_ID: 'team_3gHsyR3zCdpVWtnv3r0SJ5Vq'
    VERCEL_PROJECT_ID: 'prj_l87xKr7EHmwof8lhSHquhXlPEL5B'
  script:
    - cd frontend
    - npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
  environment:
    name: production
    url: https://overforge.vercel.app

# ─────────────────────── 6. Deploy backend → beef VPS (ARM, native build) ───
# Runs on main once BEEF_SSH_KEY (file CI var) is set. Ships backend/ + deploy/ to
# beef over SSH and rebuilds the backend image natively on arm64, then health-checks
# through Caddy. The host-only deploy/backend.env (secrets) is preserved.
deploy-backend:
  stage: deploy
  image: alpine:3.20
  # Serialize every job that runs `docker compose` against beef's shared project: concurrent
  # invocations race on container reconciliation (one recreates a service the other holds a stale
  # id for → "No such container"). resource_group is a GitLab mutex across the whole project.
  resource_group: beef
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $BEEF_SSH_KEY'
  before_script:
    - apk add --no-cache openssh-client rsync curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$BEEF_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - printf 'Host beef\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n' "$BEEF_HOST" "$BEEF_USER" > ~/.ssh/config
  script:
    - rsync -az --delete --exclude node_modules --exclude '.env*' backend/ beef:overforge/backend/
    # backend.env AND voice.env are host-only secrets files — every deploy/ rsync must exclude both.
    - rsync -az --exclude backend.env --exclude voice.env deploy/ beef:overforge/deploy/
    # Ensure every language image the kernel runs is present on the host (--pull never at run
    # time means a missing image hard-fails). Idempotent; pulls only what's new.
    - ssh beef 'cd ~/overforge && bash deploy/pull-runtimes.sh'
    # Pre-warm the persistent Go build cache (idempotent) before the backend serves, so the
    # first Go /run isn't a cold ~10s stdlib compile. See deploy/warm-caches.sh.
    - ssh beef 'cd ~/overforge && bash deploy/warm-caches.sh'
    - ssh beef 'cd ~/overforge && docker compose -f deploy/docker-compose.yml up -d --build --no-deps backend && sleep 4 && docker compose -f deploy/docker-compose.yml ps'
    - ssh beef 'curl -fsS --resolve 140.245.14.50.sslip.io:443:127.0.0.1 https://140.245.14.50.sslip.io/health'
    # keep beef's disk bounded: drop dangling images + cap build cache (native rebuilds accumulate otherwise)
    - ssh beef 'docker image prune -f >/dev/null; docker builder prune -f --keep-storage=5GB >/dev/null; echo pruned'
  environment:
    name: backend-beef
    url: https://140.245.14.50.sslip.io

# ─────────────────────── 7. Deploy voice → beef VPS (ARM, native build) ───
# Same SSH path as deploy-backend, but gated on `changes:` so the heavy torch+models image
# (CPU-only wheels: see voice/pyproject.toml) only rebuilds when voice/ or the routing files
# actually change — every other main push skips it. Not interruptible: a half-built image is
# worse than a queued one. Caddy is force-recreated (single-file bind-mounts keep the OLD
# inode on rsync-in-place, so `reload` reads stale config — recreate picks up the /voice route).
deploy-voice:
  stage: deploy
  image: alpine:3.20
  interruptible: false
  timeout: 45m
  resource_group: beef # shares beef's docker-compose project with deploy-backend — never run both at once
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $BEEF_SSH_KEY'
      changes:
        - voice/**/*
        - deploy/docker-compose.yml
        - deploy/Caddyfile
        - .gitlab-ci.yml # re-verify the deploy whenever its own logic changes (build is layer-cached)
  before_script:
    - apk add --no-cache openssh-client rsync curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$BEEF_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - printf 'Host beef\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n' "$BEEF_HOST" "$BEEF_USER" > ~/.ssh/config
  script:
    # Ship source only — the venv (wrong platform), caches, and tests never belong on the host.
    - rsync -az --delete --exclude '.venv' --exclude '__pycache__' --exclude '*.pyc' --exclude '.pytest_cache' --exclude '.ruff_cache' --exclude '.mypy_cache' --exclude '.fixtures' voice/ beef:overforge/voice/
    # backend.env AND voice.env are host-only secrets files — every deploy/ rsync must exclude both.
    - rsync -az --exclude backend.env --exclude voice.env deploy/ beef:overforge/deploy/
    # --no-deps: build + (re)start ONLY voice/caddy. Without it, `up` reconciles the whole project and
    # may recreate the backend/postgres containers another job owns — the source of the earlier race.
    - ssh beef 'cd ~/overforge && docker compose -f deploy/docker-compose.yml up -d --build --no-deps voice'
    - ssh beef 'cd ~/overforge && docker compose -f deploy/docker-compose.yml up -d --no-deps --force-recreate caddy && docker compose -f deploy/docker-compose.yml ps'
    # Wait for the service to finish warming the baked models (lifespan ~30 s) before declaring success.
    # The trailing test makes the job FAIL if it never goes healthy (a bare loop would exit 0 on timeout).
    - ssh beef 'ok=0; for i in $(seq 1 40); do if curl -fsS --resolve 140.245.14.50.sslip.io:443:127.0.0.1 https://140.245.14.50.sslip.io/voice/healthz; then ok=1; break; fi; sleep 5; done; [ "$ok" = 1 ]'
    - ssh beef 'docker image prune -f >/dev/null; docker builder prune -f --keep-storage=5GB >/dev/null; echo pruned'
  environment:
    name: voice-beef
    url: https://140.245.14.50.sslip.io/voice/healthz
