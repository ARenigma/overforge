<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Finite mark: a bounded loop (the process) that resolves to an accepting state (the double-circle
       terminal node) — automata theory made into a logo. Ink chip so it reads on any browser tab. -->
  <rect width="24" height="24" rx="5" fill="#0e1220" />
  <path
    d="M12 18.6 A 6.6 6.6 0 1 1 17.05 16.25"
    fill="none"
    stroke="#dfe4f2"
    stroke-width="1.9"
    stroke-linecap="round"
  />
  <circle cx="17.05" cy="16.25" r="2.15" fill="none" stroke="#6f8cff" stroke-width="1.5" />
  <circle cx="17.05" cy="16.25" r="1" fill="#6f8cff" />
</svg>
