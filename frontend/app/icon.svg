  <path
    d="M 12 12.6 C 9.7 9.2 4.6 9.2 4.6 12.6 C 4.6 16 9.7 16 12 12.6 C 13.7 10 16.5 8.9 18.2 10"
    fill="none"
    stroke="#ededed"
    stroke-width="2.3"
    stroke-linecap="round"
  />
  <circle cx="19.5" cy="11.3" r="1.9" fill="#3d6aff" />
</svg>
