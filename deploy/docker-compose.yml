# Overforge backend stack on the Oracle VPS (beef, ARM64).
#   caddy   — public TLS reverse proxy (auto-cert via sslip.io)
#   backend — Core API & Orchestration (the TS service)
#
# Code execution is Docker-per-run: the backend spawns ephemeral, locked-down
# containers on the HOST daemon via the mounted socket (see backend/src/execution/docker.ts).
# No separate execution service. Language images are pre-pulled by deploy/pull-runtimes.sh.
#
# Runtime secrets live in ./backend.env on the host (NOT in git). The backend image
# comes from the GitLab registry in CI ($BACKEND_IMAGE); for a manual/first deploy
# it builds from ../backend.
name: overforge

# ── Resource budget (4-core ARM, ~20 GB RAM) ────────────────────────────────
# The Docker-per-run executor (backend/src/execution/docker.ts) spawns short-lived
# containers outside this compose stack and has its own per-run limits defined there.
# The allocations below leave ~12 GB + 1 core free for the OS, Caddy TLS state,
# executor containers, and kernel buffers.
#
#   caddy   : 256 MB / 0.5 CPU  (TLS proxy, low memory steady-state)
#   backend : 3 GB  / 1.5 CPU  (Node API + LLM proxy + orchestration)
#   voice   : 4 GB  / 1.5 CPU  (ONNX/ctranslate2/torch CPU models)
#
# Limits use top-level service keys (mem_limit / cpus / pids_limit) — valid for
# plain `docker compose up -d`. Do NOT switch to `deploy.resources`; that syntax
# is only honoured by `docker stack deploy` (Swarm mode) and is silently ignored
# by compose up.
# ────────────────────────────────────────────────────────────────────────────

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    depends_on:
      - backend
      - voice

  backend:
    image: ${BACKEND_IMAGE:-overforge-backend:latest}
    build:
      context: ../backend
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 512m
    cpus: 1.5
    pids_limit: 512
    env_file:
      - ./backend.env
      - path: ./release.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '5001'
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    expose:
      - '5001'
    # Docker-out-of-Docker: the (trusted) backend drives the host daemon to run
    # candidate code in jailed sub-containers. group_add 111 = host 'docker' gid,
    # letting the non-root 'node' user read the 660 root:docker socket.
    group_add:
      - '111'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Python real-time voice service (P2-B): browser WS → endpointer → whisper STT → /answer → cues.
  # The candidate token is supplied per-connection by the browser; models are baked into the image
  # (offline cold start). Optional STT-provider secrets (P1-A: STT_PROVIDER / ASSEMBLYAI_API_KEY /
  # STT_KEYTERMS and tuning) live in ./voice.env on the HOST only — see voice.env.example. The file
  # is optional (required: false — compose >= 2.24) so local dev without it still boots on the
  # default whisper path. NOTE: nothing in the `environment:` block below may duplicate a voice.env
  # key — `environment:` would win and silently pin the value.
  voice:
    image: ${VOICE_IMAGE:-overforge-voice:latest}
    build:
      context: ../voice
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 1g
    cpus: 1.5
    pids_limit: 512
    env_file:
      - path: ./voice.env
        required: false
    environment:
      OVERFORGE_API_URL: http://backend:5001 # internal compose DNS — NOT the public TLS host
      FRONTEND_URL: https://overforge.vercel.app # allowed WS Origin (the deployed frontend)
      PORT: '5002'
      MAX_CONNECTIONS: '4'
      STT_CONCURRENCY: '2'
      # STT (Whisper/ctranslate2) uses all 4 cores. The Docker-per-run executor is ephemeral and
      # never overlaps oral speech, so the old cap of 2 just throttled STT (~4-6s → ~2-3s at 4
      # threads; whisper-small is ~1s unthrottled). Concurrency still bounded by STT_CONCURRENCY.
      OMP_NUM_THREADS: '4'
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    expose:
      - '5002'
    depends_on:
      - backend

volumes:
  caddy_data: {}
  caddy_config: {}
