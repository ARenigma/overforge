# Overforge backend stack on the Oracle VPS (beef, ARM64).
#   caddy   — public TLS reverse proxy (auto-cert via sslip.io)
#   backend — Core API & Orchestration (the TS service)
#
# Code execution is Docker-per-run: the backend spawns ephemeral, locked-down
# containers on the HOST daemon via the mounted socket (see backend/src/execution/docker.ts).
# No separate execution service. Language images are pre-pulled by deploy/pull-runtimes.sh.
#
# Runtime secrets live in ./backend.env on the host (NOT in git). The backend image
# comes from the GitLab registry in CI ($BACKEND_IMAGE); for a manual/first deploy
# it builds from ../backend.
name: overforge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-overforge-backend:latest}
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      NODE_ENV: production
      PORT: '5001'
    expose:
      - '5001'
    # Docker-out-of-Docker: the (trusted) backend drives the host daemon to run
    # candidate code in jailed sub-containers. group_add 111 = host 'docker' gid,
    # letting the non-root 'node' user read the 660 root:docker socket.
    group_add:
      - '111'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  caddy_data: {}
  caddy_config: {}
