[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade
select = ["E", "W", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = [
  "E501",  # line too long — handled by formatter
  "B008",  # function call in default argument (FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
