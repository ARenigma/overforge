AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Event-Driven Notification System Infrastructure'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name
  
  SystemName:
    Type: String
    Default: notification-system
    Description: Name of the system for resource naming

Globals:
  Function:
    Runtime: python3.9
    Handler: lambda_function.lambda_handler
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        SYSTEM_NAME: !Ref SystemName

Resources:
  # DynamoDB Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${SystemName}-users-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  NotificationLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${SystemName}-notification-logs-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: log_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: log_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # EventBridge Custom Bus
  NotificationEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${SystemName}-event-bus-${Environment}'

  # SNS Topics for Notifications
  EmailNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${SystemName}-email-notifications-${Environment}'
      DisplayName: Email Notifications
      KmsMasterKeyId: alias/aws/sns

  SMSNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${SystemName}-sms-notifications-${Environment}'
      DisplayName: SMS Notifications
      KmsMasterKeyId: alias/aws/sns

  # IAM Roles
  UserManagementLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${SystemName}-user-management-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: 
                  - !GetAtt UsersTable.Arn
                  - !Sub '${UsersTable.Arn}/index/*'
        - PolicyName: EventBridgeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt NotificationEventBus.Arn

  NotificationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${SystemName}-notification-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: 
                  - !GetAtt UsersTable.Arn
                  - !Sub '${UsersTable.Arn}/index/*'
                  - !GetAtt NotificationLogsTable.Arn
                  - !Sub '${NotificationLogsTable.Arn}/index/*'
        - PolicyName: SNSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: 
                  - !Ref EmailNotificationTopic
                  - !Ref SMSNotificationTopic

  # Lambda Functions
  UserManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${SystemName}-user-management-${Environment}'
      Runtime: python3.9
      Handler: lambda_function.lambda_handler
      CodeUri: ./src/user-management/
      Role: !GetAtt UserManagementLambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          EVENT_BUS_NAME: !Ref NotificationEventBus
      Events:
        UserManagementAPI:
          Type: Api
          Properties:
            RestApiId: !Ref UserManagementAPI
            Path: /{proxy+}
            Method: ANY

  NotificationHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${SystemName}-notification-handler-${Environment}'
      Runtime: nodejs18.x
      Handler: index.handler
      CodeUri: ./src/notification-handler/
      Role: !GetAtt NotificationLambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          EMAIL_TOPIC_ARN: !Ref EmailNotificationTopic
          SMS_TOPIC_ARN: !Ref SMSNotificationTopic
      Events:
        UserRegisteredEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref NotificationEventBus
            Pattern:
              source: ['user-management-service']
              detail-type: ['user.registered']
        UserLoginEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref NotificationEventBus
            Pattern:
              source: ['user-management-service']
              detail-type: ['user.login']
        UserProfileUpdatedEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref NotificationEventBus
            Pattern:
              source: ['user-management-service']
              detail-type: ['user.profile_updated']

  # API Gateway
  UserManagementAPI:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${SystemName}-user-api-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: Usage plan for User Management API
          Quota:
            Limit: 10000
            Period: MONTH
          Throttle:
            BurstLimit: 100
            RateLimit: 50

  # API Key for the API Gateway
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub '${SystemName}-api-key-${Environment}'
      Description: API Key for User Management API
      Enabled: true

  # Associate API Key with Usage Plan
  ApiKeyUsagePlanAssociation:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UserManagementAPIUsagePlan

  # EventBridge Rules for different notification types
  UserRegistrationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${SystemName}-user-registration-rule-${Environment}'
      Description: Route user registration events to notification handler
      EventBusName: !Ref NotificationEventBus
      EventPattern:
        source: ['user-management-service']
        detail-type: ['user.registered']
      State: ENABLED
      Targets:
        - Arn: !GetAtt NotificationHandlerFunction.Arn
          Id: NotificationHandlerTarget
          InputTransformer:
            InputPathsMap:
              detail: $.detail
            InputTemplate: '{"detail": <detail>, "detail-type": "user.registered"}'

  UserLoginRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${SystemName}-user-login-rule-${Environment}'
      Description: Route user login events to notification handler
      EventBusName: !Ref NotificationEventBus
      EventPattern:
        source: ['user-management-service']
        detail-type: ['user.login']
      State: ENABLED
      Targets:
        - Arn: !GetAtt NotificationHandlerFunction.Arn
          Id: NotificationHandlerTarget

  # Lambda Permissions for EventBridge
  EventBridgeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotificationHandlerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${NotificationEventBus}/*'

  # CloudWatch Log Groups
  UserManagementLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${UserManagementFunction}'
      RetentionInDays: 14

  NotificationHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NotificationHandlerFunction}'
      RetentionInDays: 14

  # CloudWatch Alarms
  UserManagementErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${SystemName}-user-management-errors-${Environment}'
      AlarmDescription: Alarm for user management function errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref UserManagementFunction

  NotificationHandlerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${SystemName}-notification-handler-errors-${Environment}'
      AlarmDescription: Alarm for notification handler function errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificationHandlerFunction

Outputs:
  UserManagementAPIUrl:
    Description: URL of the User Management API
    Value: !Sub 'https://${UserManagementAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${SystemName}-api-url-${Environment}'

  ApiKeyId:
    Description: API Key ID for accessing the User Management API
    Value: !Ref ApiKey
    Export:
      Name: !Sub '${SystemName}-api-key-${Environment}'

  EventBusName:
    Description: Name of the EventBridge custom bus
    Value: !Ref NotificationEventBus
    Export:
      Name: !Sub '${SystemName}-event-bus-${Environment}'

  UsersTableName:
    Description: Name of the Users DynamoDB table
    Value: !Ref UsersTable
    Export:
      Name: !Sub '${SystemName}-users-table-${Environment}'

  EmailTopicArn:
    Description: ARN of the Email Notification SNS Topic
    Value: !Ref EmailNotificationTopic
    Export:
      Name: !Sub '${SystemName}-email-topic-${Environment}'

  SMSTopicArn:
    Description: ARN of the SMS Notification SNS Topic
    Value: !Ref SMSNotificationTopic
    Export:
      Name: !Sub '${SystemName}-sms-topic-${Environment}'