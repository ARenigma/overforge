[project]
name = "overforge-voice"
version = "0.1.0"
description = "Overforge P2-B voice pipeline — candidate talk-back core (endpointing + STT)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "soundfile>=0.12",
    "torch>=2.3",
    "silero-vad>=5.1",
    "pipecat-ai>=1.4.0",
    "faster-whisper>=1.2.1",
    "librosa>=0.10",
    "httpx>=0.28.1",
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.49.0",
    "websockets>=16.0",
]

# Pin torch + torchaudio to CPU-only wheels ON LINUX (the beef arm64 deploy target). The default
# PyPI torch wheel drags in ~1.5 GB of CUDA libraries (nvidia-cuda-*, cudnn, …) that a CPU-only VPS
# can never use — the cpu index ships the same torch with NO cuda deps. macOS local dev is excluded
# by the sys_platform marker, so it keeps the default build (which is already CPU there).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
