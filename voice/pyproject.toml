[project]
name = "overforge-voice"
version = "0.1.0"
description = "Overforge P2-B voice pipeline — candidate talk-back core (endpointing + STT)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "soundfile>=0.12",
    "torch>=2.3",
    "silero-vad>=5.1",
    "pipecat-ai>=1.4.0",
    "faster-whisper>=1.2.1",
    "librosa>=0.10",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
