[project]
name = "voice-turn-bakeoff"
version = "0.1.0"
description = "Offline Phase 1 voice turn-detection bake-off harness for Overforge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "pandas>=2.2",
    "librosa>=0.10",
    "soundfile>=0.12",
    "huggingface-hub>=0.23",
    "transformers>=4.40",
    "torch>=2.3",
    "silero-vad>=5.1",
    "jiwer>=3.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
